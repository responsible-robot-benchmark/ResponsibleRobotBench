[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "responsible-robot-bench"
version = "0.1.0"
description = "ResponsibleRobotBench task registry, planner interfaces, and evaluation tools"
readme = "README.md"
requires-python = ">=3.9"

[project.urls]
Repository = "https://github.com/Ju6276/ResponsibleRobotBench"

[tool.setuptools.packages.find]
include = ["responsible_robot_bench*"]
exclude = ["responsible_robot_bench.policies*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.png", "*.ttm", "*.ttt", "*.txt", "*.yaml", "*.lua", "*.mlx"]
"responsible_robot_bench.configs" = ["tasks.json"]
