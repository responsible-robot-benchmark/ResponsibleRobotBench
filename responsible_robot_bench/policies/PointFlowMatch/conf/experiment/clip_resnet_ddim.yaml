# @package _global_
defaults:
  - override /model: ddim
  - override /backbone: clip_resnet

obs_mode: rgb  # pcd | rgb
obs_features_dim: 512
x_dim: 3594

dataset:
  use_pcd_color: null
  n_points: null
  use_language: True
  fix_instruction: True

dataloader:
  batch_size: 32
  num_workers: 12
  prefetch_factor: 1
  pin_memory: True
  drop_last: True

model:
  _target_: pfp.policy.ddim_policy.DDIMPolicyImage
  augment_data: False  # done in backbone
  n_obs_steps: 2