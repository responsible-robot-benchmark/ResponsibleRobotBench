# @package _global_
defaults:
  - override /model: flow
  - override /backbone: clip_vit

obs_mode: rgb  # pcd | rgb
obs_features_dim: 512
x_dim: 3840  # 5*512 (img) + 512 (robot) + 512 (lang) + 256 (safety)
y_dim: 12

dataset:
  use_pcd_color: null
  n_points: null
  use_language: True
  fix_instruction: True

dataloader:
  batch_size: 32
  num_workers: 12
  prefetch_factor: 1
  pin_memory: True
  drop_last: True

model:
  _target_: pfp.policy.fm_policy.FMPolicyImage
  augment_data: False  # done in backbone
  n_obs_steps: 2
  diffusion_net:
    global_cond_dim: ${x_dim}
